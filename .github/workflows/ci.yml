name: CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write   # allow the release job to upload assets

jobs:
  build:
    name: Build & test (Windows x64)
    runs-on: windows-latest
    env:
      # Hoisted here because the `secrets` context can't be used in a step `if:`.
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake, Visual Studio 2022, x64)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Run tests
        run: build\Release\ShadowPlay_Tests.exe

      # Optional Authenticode signing. Runs only if the repo has a signing
      # certificate configured in Settings -> Secrets:
      #   SIGN_PFX_BASE64     - base64 of your .pfx code-signing certificate
      #   SIGN_PFX_PASSWORD   - the .pfx password
      # Without those secrets this step is skipped, so CI still works for forks.
      - name: Sign binaries (if a certificate is configured)
        if: ${{ env.SIGN_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
                       Sort-Object FullName -Descending | Select-Object -First 1).FullName
          foreach ($exe in 'ShadowPlay_Patcher_GUI.exe','ShadowPlay_Patcher.exe') {
            & $signtool sign /fd SHA256 /f $pfx /p $env:SIGN_PFX_PASSWORD `
              /tr http://timestamp.digicert.com /td SHA256 "build\Release\$exe"
          }
          Remove-Item $pfx -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShadowPlay_Patcher
          path: |
            build/Release/ShadowPlay_Patcher_GUI.exe
            build/Release/ShadowPlay_Patcher.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          name: ShadowPlay_Patcher
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
